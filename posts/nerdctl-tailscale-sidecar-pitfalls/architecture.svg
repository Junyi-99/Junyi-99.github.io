<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7" fill="#555" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7" fill="#0891b2" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e1e1e">nerdctl + Tailscale Sidecar Architecture</text>

  <!-- Host Zone -->
  <rect x="20" y="56" width="880" height="280" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1.2"/>
  <text x="40" y="80" font-size="14" font-weight="600" fill="#2563eb">Host (containerd / nerdctl compose)</text>

  <!-- Shared Network Namespace Zone -->
  <rect x="50" y="96" width="560" height="160" rx="10" fill="#e5dbff" fill-opacity="0.35" stroke="#8b5cf6" stroke-width="1"/>
  <text x="70" y="118" font-size="13" font-weight="600" fill="#6d28d9">Shared Network Namespace</text>

  <!-- App Container -->
  <rect x="80" y="140" width="170" height="70" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.8"/>
  <text x="165" y="171" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">App Container</text>
  <text x="165" y="191" text-anchor="middle" font-size="12" fill="#555">(netshoot)</text>

  <!-- Arrow: App → Tailscale -->
  <line x1="250" y1="175" x2="318" y2="175" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="284" y="167" text-anchor="middle" font-size="11" fill="#555">traffic</text>

  <!-- Tailscale Sidecar -->
  <rect x="330" y="130" width="200" height="90" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.8"/>
  <text x="430" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">Tailscale Sidecar</text>
  <text x="430" y="188" text-anchor="middle" font-size="12" fill="#555">TS_USERSPACE=false</text>

  <!-- Arrow: Tailscale → TUN -->
  <line x1="530" y1="175" x2="638" y2="160" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="588" y="155" text-anchor="middle" font-size="11" fill="#15803d">encrypted</text>

  <!-- /dev/net/tun -->
  <rect x="650" y="130" width="170" height="60" rx="8" fill="#c3fae8" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="735" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">/dev/net/tun</text>
  <text x="735" y="175" text-anchor="middle" font-size="12" fill="#555">(WireGuard)</text>

  <!-- Required Capabilities -->
  <text x="80" y="280" font-size="12" font-weight="600" fill="#757575">Required Capabilities &amp; Config</text>
  <rect x="80" y="290" width="120" height="32" rx="6" fill="#fff3bf" stroke="#f59e0b" stroke-width="1"/>
  <text x="140" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#92400e">net_admin</text>
  <rect x="220" y="290" width="130" height="32" rx="6" fill="#fff3bf" stroke="#f59e0b" stroke-width="1"/>
  <text x="285" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#92400e">SYS_MODULE</text>
  <rect x="370" y="290" width="155" height="32" rx="6" fill="#fff3bf" stroke="#f59e0b" stroke-width="1"/>
  <text x="447" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#92400e">TS_ACCEPT_DNS</text>

  <!-- Remote Network Zone -->
  <rect x="20" y="380" width="880" height="180" rx="12" fill="#d3f9d8" fill-opacity="0.35" stroke="#22c55e" stroke-width="1.2"/>
  <text x="40" y="404" font-size="14" font-weight="600" fill="#15803d">Remote Network</text>

  <!-- WireGuard Tunnel Arrow (vertical) -->
  <line x1="735" y1="190" x2="490" y2="423" stroke="#0891b2" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-teal)"/>
  <text x="640" y="310" text-anchor="middle" font-size="13" font-weight="500" fill="#0891b2" transform="rotate(-30, 640, 310)">WireGuard Tunnel</text>

  <!-- Exit Node -->
  <rect x="350" y="420" width="200" height="70" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="450" y="451" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">Exit Node</text>
  <text x="450" y="471" text-anchor="middle" font-size="12" fill="#555">(Tailscale peer)</text>

  <!-- Arrow: Exit Node → Internet -->
  <line x1="550" y1="455" x2="638" y2="455" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="594" y="447" text-anchor="middle" font-size="11" fill="#dc2626">outbound</text>

  <!-- Public Internet -->
  <rect x="650" y="420" width="180" height="70" rx="8" fill="#ffc9c9" stroke="#ef4444" stroke-width="1.8"/>
  <text x="740" y="460" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1e1e">Public Internet</text>

  <!-- Tailscale DNS -->
  <rect x="80" y="430" width="170" height="50" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="165" y="451" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Tailscale DNS</text>
  <text x="165" y="468" text-anchor="middle" font-size="11" fill="#555">(MagicDNS)</text>

  <!-- Arrow: DNS → Exit Node -->
  <line x1="250" y1="455" x2="338" y2="455" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="294" y="447" text-anchor="middle" font-size="11" fill="#8b5cf6">DNS</text>
</svg>
